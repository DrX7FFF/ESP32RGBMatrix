[platformio]
default_envs = matrixportal_s3

[env]
platform = espressif32
board = adafruit_matrixportal_esp32s3
framework = arduino
monitor_speed = 115200
extra_scripts = pre:extra_script.py

; Matrix Portal S3: 8 MB flash, 2 MB PSRAM.
; board_build.flash_size = 8MB
; board_upload.flash_size = 8MB
; board_build.partitions = default_8MB.csv

lib_deps =
    adafruit/Adafruit Protomatter
    adafruit/Adafruit GFX Library
    fastled/FastLED

[env:matrixportal_s3]

[env:matrixportal_s3_ota]
upload_protocol = espota
upload_port = 192.168.1.175
; upload_port = ESP32RGBMatrix.local
upload_flags = --host_port=54010
monitor_port = socket://192.168.1.175:5000
